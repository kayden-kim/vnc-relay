<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Comparison of Mode II and Mode I</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f7048"/>
    </marker>
  </defs>
  <rect width="760" height="490" fill="#ffffff"/>

  <!-- Mode II -->
  <text x="20" y="34" font-size="14" fill="#58665f"><tspan font-size="16" font-weight="700" fill="#0d1a15">Mode II</tspan><tspan dx="10">The Viewer and the Server each connect to VNC Relay</tspan></text>

  <rect x="576" y="56" width="178" height="144" rx="10" fill="none" stroke="#58665f" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="665" y="188" text-anchor="middle" font-size="11" fill="#58665f">Can be behind NAT/firewall</text>

  <rect x="20" y="74" width="140" height="84" rx="10" fill="#eef2f0" stroke="#e1e7e4"/>
  <text x="90" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1a15">Viewer</text>
  <text x="90" y="132" text-anchor="middle" font-size="12.5" fill="#58665f">UltraVNC · noVNC</text>

  <rect x="280" y="68" width="190" height="96" rx="12" fill="#12352b"/>
  <text x="375" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">VNC Relay</text>
  <text x="375" y="124" text-anchor="middle" font-size="12.5" fill="#ffffff" fill-opacity="0.82">Pairs the same relay ID</text>
  <text x="375" y="146" text-anchor="middle" font-size="12" fill="#ffffff" fill-opacity="0.82" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace">[mode2]</text>

  <rect x="600" y="74" width="140" height="84" rx="10" fill="#eef2f0" stroke="#e1e7e4"/>
  <text x="670" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1a15">Server</text>
  <text x="670" y="132" text-anchor="middle" font-size="12.5" fill="#58665f">UltraVNC Server, etc.</text>

  <line x1="160" y1="116" x2="278" y2="116" stroke="#0f7048" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="214" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#0f7048" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace">ID:1234</text>
  <line x1="600" y1="116" x2="472" y2="116" stroke="#0f7048" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="536" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#0f7048" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace">ID:1234</text>

  <line x1="20" y1="222" x2="740" y2="222" stroke="#e1e7e4"/>

  <!-- Mode I -->
  <text x="20" y="254" font-size="14" fill="#58665f"><tspan font-size="16" font-weight="700" fill="#0d1a15">Mode I</tspan><tspan dx="10">VNC Relay connects to the target Server</tspan></text>

  <rect x="270" y="272" width="484" height="150" rx="10" fill="none" stroke="#58665f" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="742" y="410" text-anchor="end" font-size="11" fill="#58665f">Same internal network (example)</text>

  <rect x="20" y="296" width="140" height="84" rx="10" fill="#eef2f0" stroke="#e1e7e4"/>
  <text x="90" y="330" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1a15">Viewer</text>
  <text x="90" y="354" text-anchor="middle" font-size="12.5" fill="#58665f">UltraVNC Viewer</text>

  <rect x="280" y="290" width="190" height="96" rx="12" fill="#12352b"/>
  <text x="375" y="322" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">VNC Relay</text>
  <text x="375" y="346" text-anchor="middle" font-size="12.5" fill="#ffffff" fill-opacity="0.82">Checks target allow policy</text>
  <text x="375" y="368" text-anchor="middle" font-size="12" fill="#ffffff" fill-opacity="0.82" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace">[mode1]</text>

  <rect x="600" y="296" width="140" height="84" rx="10" fill="#eef2f0" stroke="#e1e7e4"/>
  <text x="670" y="330" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1a15">Server</text>
  <text x="670" y="354" text-anchor="middle" font-size="12.5" fill="#58665f">Waits on VNC port</text>

  <line x1="160" y1="338" x2="278" y2="338" stroke="#0f7048" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="214" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#0f7048">Target address</text>
  <line x1="470" y1="338" x2="598" y2="338" stroke="#0f7048" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="534" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#0f7048">TCP connection</text>

  <!-- Legend -->
  <line x1="20" y1="446" x2="740" y2="446" stroke="#e1e7e4"/>
  <line x1="150" y1="472" x2="186" y2="472" stroke="#0f7048" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="196" y="476" font-size="12.5" fill="#0d1a15">Direction a connection is opened</text>
  <rect x="430" y="462" width="36" height="20" rx="4" fill="none" stroke="#58665f" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="476" y="476" font-size="12.5" fill="#0d1a15">Network boundary (example)</text>
</svg>
