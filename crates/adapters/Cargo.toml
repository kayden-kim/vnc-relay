[package]
name = "vnc-relay-adapters"
description = "VNC Relay adapters: config file, network, TLS, HTTP, and other outside I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
notify.workspace = true
rpassword.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
toml_edit.workspace = true
vnc-relay-app.workspace = true
vnc-relay-domain.workspace = true

[target.'cfg(windows)'.dependencies]
# The service DACL change and account lookup of windows_service/security.rs need
# the authorization and service API features.
windows-service.workspace = true
windows-sys = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_Services"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "test-util"] }
