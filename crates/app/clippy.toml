    { path = "tokio::net::UnixStream::connect", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::UnixStream::pair", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::UnixDatagram::bind", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::UnixDatagram::pair", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::canonicalize", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::copy", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::create_dir", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::create_dir_all", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::hard_link", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::metadata", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::read", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::read_dir", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::read_link", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::read_to_string", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::remove_dir", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::remove_dir_all", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::remove_file", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::rename", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::set_permissions", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::symlink", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::symlink_dir", reason = "app does file I/O only through port traits", allow-invalid = true },
