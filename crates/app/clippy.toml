    { path = "tokio::fs::try_exists", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::write", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::File::open", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::File::create", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::OpenOptions::new", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::process::Command::new", reason = "app does not start processes", allow-invalid = true },
    { path = "tokio::signal::ctrl_c", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::unix::signal", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_c", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_break", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_close", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::ctrl_logoff", reason = "only the executable handles OS signals", allow-invalid = true },
