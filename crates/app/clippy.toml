# Clippy settings for vnc-relay-app. This file replaces the root clippy.toml for
# this crate, so the root keys are repeated here.
# I/O bans: docs/architectures/code-map.md, layer "app". Tokio is used only for
# time, synchronization, and generic I/O traits, never OS I/O.
# OS-specific paths and disabled Tokio features may be absent in a build.
# allow-invalid retains each ban whenever that path becomes available.
allow-expect-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true

disallowed-types = [
    { path = "std::fs::File", reason = "app does file I/O only through port traits" },
    { path = "std::net::TcpListener", reason = "app does network I/O only through port traits" },
    { path = "std::net::TcpStream", reason = "app does network I/O only through port traits" },
    { path = "std::net::UdpSocket", reason = "app does network I/O only through port traits" },
    { path = "std::process::Command", reason = "app does not start processes" },
    { path = "tokio::net::TcpListener", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::TcpSocket", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::TcpStream", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::UdpSocket", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::UnixListener", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::UnixStream", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::UnixDatagram", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::unix::pipe::Sender", reason = "app does OS I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::unix::pipe::Receiver", reason = "app does OS I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::windows::named_pipe::NamedPipeClient", reason = "app does OS I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::windows::named_pipe::NamedPipeServer", reason = "app does OS I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::windows::named_pipe::ClientOptions", reason = "app does OS I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::windows::named_pipe::ServerOptions", reason = "app does OS I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::File", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::OpenOptions", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::ReadDir", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::fs::DirEntry", reason = "app does file I/O only through port traits", allow-invalid = true },
    { path = "tokio::process::Command", reason = "app does not start processes", allow-invalid = true },
    { path = "tokio::process::Child", reason = "app does not start processes", allow-invalid = true },
    { path = "tokio::process::ChildStdin", reason = "app does not start processes", allow-invalid = true },
    { path = "tokio::process::ChildStdout", reason = "app does not start processes", allow-invalid = true },
    { path = "tokio::process::ChildStderr", reason = "app does not start processes", allow-invalid = true },
    { path = "tokio::signal::unix::Signal", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::CtrlC", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::CtrlBreak", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::CtrlClose", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::CtrlLogoff", reason = "only the executable handles OS signals", allow-invalid = true },
    { path = "tokio::signal::windows::CtrlShutdown", reason = "only the executable handles OS signals", allow-invalid = true },
]

disallowed-methods = [
    { path = "std::fs::read", reason = "app does file I/O only through port traits" },
    { path = "std::fs::read_to_string", reason = "app does file I/O only through port traits" },
    { path = "std::fs::write", reason = "app does file I/O only through port traits" },
    { path = "std::env::var", reason = "settings come only from the config file (config-v2 §1.1)" },
    { path = "std::env::var_os", reason = "settings come only from the config file (config-v2 §1.1)" },
    { path = "std::time::SystemTime::now", reason = "app reads time through the Clock port" },
    { path = "std::time::Instant::now", reason = "app reads time through the Clock port" },
    { path = "tokio::net::lookup_host", reason = "app resolves names only through port traits", allow-invalid = true },
    { path = "tokio::net::TcpListener::bind", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::TcpStream::connect", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::TcpSocket::new_v4", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::TcpSocket::new_v6", reason = "app does network I/O only through port traits", allow-invalid = true },
    { path = "tokio::net::UdpSocket::bind", reason = "app does network I/O only through port traits", allow-invalid = true },
