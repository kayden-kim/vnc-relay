[package]
name = "vnc-relay-tray"
description = "Windows notification-area controller for the VNC Relay service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vnc-relay-tray"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
windows-registry.workspace = true
windows-service.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
vnc-relay-adapters.workspace = true
vnc-relay-application.workspace = true
