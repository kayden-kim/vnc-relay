[workspace]
members = ["xtask", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Versions of external crates: docs/conventions/rust.md section 2 ("의존성").
[workspace.dependencies]
aws-lc-rs = "1.18.2"
clap = { version = "4.6.7", default-features = false, features = ["std", "error-context"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.0", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
vnc-relay-adapters = { path = "crates/adapters" }
vnc-relay-app = { path = "crates/app" }
vnc-relay-domain = { path = "crates/domain" }

# Lint policy: docs/conventions/rust.md section 2.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
mod_module_files = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[package]
name = "vnc-relay"
description = "UltraVNC Repeater compatible TCP/WS/WSS relay server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vnc-relay"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync"] }
vnc-relay-adapters.workspace = true
vnc-relay-app.workspace = true
vnc-relay-domain.workspace = true

# System tests open client sockets from chosen loopback source addresses.
[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt"] }
