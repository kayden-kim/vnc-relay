[workspace]
members = ["xtask", "crates/*"]
resolver = "3"

[workspace.package]
version = "2026.11.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Versions of external crates: docs/conventions/rust.md section 2 ("의존성").
[workspace.dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
aws-lc-rs = "1.18.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "error-context"] }
notify = "8.2.0"
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.0", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12", "aws_lc_rs"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }
vnc-relay-adapters = { path = "crates/adapters" }
vnc-relay-app = { path = "crates/app" }
vnc-relay-domain = { path = "crates/domain" }

# Lint policy: docs/conventions/rust.md section 2.
[workspace.lints.rust]
# Only crates/adapters/src/terminal/windows_console.rs, the pseudo-console module of
# tests/windows_console.rs, and the Windows handle-snapshot module of
# tests/performance.rs allow `unsafe` (docs/conventions/rust.md section 2).
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
mod_module_files = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[package]
name = "vnc-relay"
description = "UltraVNC Repeater compatible TCP/WS/WSS relay server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vnc-relay"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync"] }
vnc-relay-adapters.workspace = true
vnc-relay-app.workspace = true
vnc-relay-domain.workspace = true

# System tests open client sockets from chosen loopback source addresses, and
# check the public HTTPS management listener with a TLS client.
[dev-dependencies]
rustls = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }
tokio-tungstenite.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_Threading", "Win32_System_Pipes", "Win32_System_Threading"] }
