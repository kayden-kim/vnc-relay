# Fast checks and release bundles on both supported OSes (docs/how-to/release.md).
# The full test run (`cargo xtask scenarios`) stays in the local gates
# (user decision 2026-11-08 (Q162)).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Use prebuilt NASM objects for aws-lc-sys
        if: runner.os == 'Windows'
        run: echo "AWS_LC_SYS_PREBUILT_NASM=1" >> $env:GITHUB_ENV

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --package xtask --locked
      - run: cargo xtask layers
      - run: cargo xtask tokens --check
      - run: cargo deny check licenses
      - run: cargo xtask package

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ runner.os }}
          path: |
            target/package/*.zip
            target/package/*.tar.gz
            target/package/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Check that the bundles carry the tag version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in "vnc-relay-$version-windows-x64.zip" "vnc-relay-$version-linux-x64.tar.gz"; do
            if [ ! -f "dist/$file" ] || [ ! -f "dist/$file.sha256" ]; then
              echo "dist/$file or its .sha256 is missing: tag $GITHUB_REF_NAME does not match the Cargo.toml version" >&2
              ls -l dist >&2
              exit 1
            fi
          done
          cd dist && sha256sum -c ./*.sha256

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "vnc-relay ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
